# Checks every push and pull request: lint, unit tests, a dependency scan and
# a production build. The app lives in the anarock/ folder.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anarock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anarock/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Dependency scan
        run: npm audit --audit-level=high
      - run: npm run build
